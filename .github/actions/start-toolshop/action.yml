name: Start Toolshop
description: >
  Starts the Toolshop app in the CI runner with Docker Compose, with fresh seed data.
  Same steps as the app's own CI: https://github.com/testsmith-io/practice-software-testing

inputs:
  with-ui:
    description: Also start and wait for the Angular UI (not needed for API-only jobs)
    default: 'true'
  ref:
    description: App commit to test against (fixed, so results are the same)
    default: ae7caecb811dd8952c09d997e69be7cb946ecd44

runs:
  using: composite
  steps:
    - name: Check out the Toolshop app
      uses: actions/checkout@v7
      with:
        repository: testsmith-io/practice-software-testing
        ref: ${{ inputs.ref }}
        path: toolshop

    - name: Start containers
      shell: bash
      working-directory: toolshop
      env:
        SPRINT: sprint5
        DISABLE_LOGGING: 'true'
      run: |
        services="laravel-api web mariadb"
        if [ "${{ inputs.with-ui }}" = "true" ]; then services="$services angular-ui"; fi
        # Docker Hub sometimes returns 5xx, so retry a few times.
        for attempt in 1 2 3 4; do
          docker compose -f docker-compose.yml up -d --build $services && exit 0
          echo "::warning::docker compose up attempt $attempt failed; retrying"
          sleep $((attempt * 20))
        done
        exit 1

    - name: Install API dependencies
      shell: bash
      working-directory: toolshop
      run: |
        for i in $(seq 1 30); do
          docker compose exec -T laravel-api true 2>/dev/null && break
          echo "Waiting for API container ($i/30)..."; sleep 2
        done
        docker compose exec -T -u root laravel-api \
          composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
        # composer runs as root, but PHP-FPM (www-data) must be able to write cache and logs.
        docker compose exec -T -u root laravel-api sh -c \
          "chown -R www-data:www-data storage bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache"

    - name: Create and seed the database
      shell: bash
      working-directory: toolshop
      run: |
        for i in $(seq 1 30); do
          docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null && break
          echo "Waiting for MariaDB ($i/30)..."; sleep 2
        done
        docker compose exec -T laravel-api php artisan migrate:refresh --seed

    - name: Wait for the API
      shell: bash
      run: |
        for i in $(seq 1 30); do
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8091/products)" = "200" ] && echo "API ready" && exit 0
          echo "Waiting for API ($i/30)..."; sleep 2
        done
        echo "::group::API diagnostics"
        echo "--- Exception reported by GET /products:"
        curl -s http://localhost:8091/products | grep -oE '<title>[^<]*</title>|"message": *"[^"]*"' | head -5
        echo "--- Last Laravel log lines:"
        docker compose -f toolshop/docker-compose.yml exec -T laravel-api sh -c 'tail -n 40 storage/logs/*.log 2>/dev/null || echo "(no log file)"'
        echo "--- Storage permissions:"
        docker compose -f toolshop/docker-compose.yml exec -T laravel-api ls -la storage storage/framework
        echo "::endgroup::"
        exit 1

    - name: Wait for the UI
      if: inputs.with-ui == 'true'
      shell: bash
      run: |
        for i in $(seq 1 90); do
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200)" = "200" ] && echo "UI ready" && exit 0
          echo "Waiting for Angular UI ($i/90)..."; sleep 5
        done
        docker compose -f toolshop/docker-compose.yml logs angular-ui
        exit 1
