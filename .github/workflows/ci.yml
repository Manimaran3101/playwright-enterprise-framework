name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night at 02:00 UTC, all browsers
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      all_browsers:
        description: 'Run Firefox, WebKit and mobile too (not just Chromium)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  CI: true
  # Tests use the Toolshop app started in each job (.github/actions/start-toolshop), not the public site.
  TEST_ENV: local

jobs:
  quality:
    name: Lint, types & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api:
    name: API tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/start-toolshop
        with:
          with-ui: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run API tests (no browser needed)
        run: npx playwright test --project=api
        env:
          BLOB_REPORT_NAME: api
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-api
          path: blob-report
          retention-days: 3

  ui:
    name: UI ${{ matrix.project }} (shard ${{ matrix.shard }}/2)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # PRs and pushes: Chromium only. Nightly or "all browsers": all 4.
        project: ${{ fromJSON((github.event_name == 'schedule' || inputs.all_browsers) && '["chromium","firefox","webkit","mobile-chrome"]' || '["chromium"]') }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Run the tests in Microsoft's Playwright image (browsers already installed).
      # Installing with apt on the runner was too slow on some runners.
      - name: Pull the Playwright image
        id: pw
        run: |
          image="mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            docker pull -q "$image" && exit 0
            echo "::warning::docker pull attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: ./.github/actions/start-toolshop

      - name: Run tests
        # --network host: the app runs on localhost:4200 / :8091. --ipc host is recommended
        # for Chromium in Docker. Same path inside the container, otherwise merge-reports fails.
        run: |
          docker run --rm --init --network host --ipc host \
            -v "$PWD":"$PWD" -w "$PWD" \
            -e CI -e TEST_ENV -e BLOB_REPORT_NAME \
            "${{ steps.pw.outputs.image }}" \
            npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          BLOB_REPORT_NAME: ${{ matrix.project }}-${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  report:
    name: Merge reports
    needs: [api, ui]
    # Merge reports also when tests failed.
    if: ${{ !cancelled() && (needs.api.result != 'skipped' || needs.ui.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge shard reports into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
      - name: Prepare report for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

  deploy-report:
    name: Publish report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
