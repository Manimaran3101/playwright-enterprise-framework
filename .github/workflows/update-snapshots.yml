name: Update visual baselines

# Makes the Linux visual baselines in the same Docker image and app version as CI.
# Run it by hand after a UI change. It commits the new baselines.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull the Playwright image
        id: pw
        run: |
          image="mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker pull -q "$image"
      - uses: ./.github/actions/start-toolshop
      - name: Regenerate visual baselines
        run: |
          docker run --rm --init --network host --ipc host \
            -v "$PWD":"$PWD" -w "$PWD" -e CI=true -e TEST_ENV=local \
            "${{ steps.pw.outputs.image }}" \
            npx playwright test --project=chromium --grep @visual --update-snapshots
      - name: Commit changed baselines
        run: |
          # Commit as the repo owner
          git config user.name "Manimaran Murugan"
          git config user.email "58616272+Manimaran3101@users.noreply.github.com"
          git add tests/visual
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update Linux visual baselines"
            git push
          fi
