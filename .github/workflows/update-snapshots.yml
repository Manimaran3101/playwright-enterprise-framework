name: Update visual baselines

# Screenshots differ between environments, so the Linux baselines CI compares
# against are generated in the same Playwright Docker image and app version CI uses.
# Run this manually after an intended UI change; it commits the new baselines back.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull the Playwright image
        id: pw
        run: |
          image="mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")-noble"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          docker pull -q "$image"
      # Same private app instance CI tests against, so baselines match what CI sees.
      - uses: ./.github/actions/start-toolshop
      - name: Regenerate visual baselines
        run: |
          docker run --rm --init --network host --ipc host \
            -v "$PWD":/work -w /work -e CI=true -e TEST_ENV=local \
            "${{ steps.pw.outputs.image }}" \
            npx playwright test --project=chromium --grep @visual --update-snapshots
      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test: update Linux visual baselines"
            git push
          fi
